<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Otaku Zone</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body */
        body {
            min-height: 100vh;
            background: linear-gradient(
                to right,
                #0d736c,
                #1fff,
                #0d736c
            );
        }

        /* Sections */
        section {
            width: 100%;
            min-height: 100vh;
            display: flex;
        }

        /* Navbar */
        .navbar {
            width: 100%;
            padding: 15px 5%;
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        /* Logo */
        .logo {
            text-decoration: none;
            font-size: 30px;
            font-weight: bold;
            color: white;
        }

        .logo span {
            color: #00ffee;
        }

        /* Theme Button */
        #theme-button {
            cursor: pointer;
            padding: 8px;
        }

        /* Menu */
        .menu-container {
            display: flex;
            align-items: center;
            gap: 25px;
            list-style: none;
        }

        .menu-container a {
            text-decoration: none;
            color: white;
        }

        /* Hamburger Button */
        .navbar-toggle {
            display: none;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 999;
        }

        .bar {
            display: block;
            width: 25px;
            height: 3px;
            margin: 5px auto;
            background-color: white;
            transition: 0.3s;
        }

        /* Active Hamburger */
        .navbar-toggle.active .bar:nth-child(2) {
            opacity: 0;
        }

        .navbar-toggle.active .bar:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }

        .navbar-toggle.active .bar:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }

        /* Mobile */
        @media (max-width: 768px) {
            .navbar-toggle {
                display: block;
            }

            .menu-container {
                display: none;
                flex-direction: column;
                gap: 20px;

                position: absolute;
                top: 100%;
                right: 0;

                width: 200px;
                padding: 20px;

                background: rgba(0, 0, 0, 0.8);
                backdrop-filter: blur(10px);
                border-radius: 10px;
            }

            .menu-container.active {
                display: flex;
            }
        }

        /* Light Mode */
        body.light {
            background: orange;
            color: black;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="nav-container">

            <a href="#" class="logo">s<span>s</span></a>

            <button id="theme-button" type="button">
                🌞
            </button>

            <button
                class="navbar-toggle"
                type="button"
                aria-label="Toggle navigation"
                aria-expanded="false"
            >
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <ul class="menu-container">
                <li><a href="index.html">Home</a></li>
                <li><a href="eposides.html">Episodes</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

        </div>
    </nav>

    <script>
        const navbarToggle = document.querySelector(".navbar-toggle");
        const menuContainer = document.querySelector(".menu-container");
        const themeButton = document.querySelector("#theme-button");

        navbarToggle.addEventListener("click", () => {
            navbarToggle.classList.toggle("active");
            menuContainer.classList.toggle("active");

            const isOpen = menuContainer.classList.contains("active");
            navbarToggle.setAttribute("aria-expanded", isOpen);
        });

        themeButton.addEventListener("click", () => {
            document.body.classList.toggle("light");

            themeButton.textContent =
                document.body.classList.contains("light") ? "🌙" : "🌞";
        });
    </script>

</body>
</html>
