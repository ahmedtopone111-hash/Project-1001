<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>project-1001</title>
    <style>
        
        /*************************
        *********basices**********
        **************************/
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: 1px solid red;
        }

        body {
          min-height: 100vh;
          background: linear-gradient(to right ,#0d736c , #1fff, #0d736c);
            display: flex;
            flex-direction: column;
        }

        body .light {
          min-height: 100vh;
          background-color: orange !important;
            
        }

        section {
          width: 100%;
          height: 100vh;
          box-sizing: border-box;
          display: flex;
        }

        /***************
        Hero Section****
        ***************/
        .hero-section {
          margin-top: 180px;
          margin-left: 70px;
          gap: 2rem;
          font-size: 40px;
          font-weight: 600;
            flex: 1;
        }

        h1 {
          color: #ffffff;
          transition: 0.5s ease;
        }

        h1:hover {
          color: red;
          transform: scale(1.1);
        }

        .hero-section span {
          color: #000000;
        }

        .img-container {
          display: flex;
          justify-content: flex-end;
        }

        .img-container img {
          position: relative;
          top: -130px;
          animation:breathe 3s ease-in-out infinite;
        }

        @keyframes breathe  {
                               100% ,0% {
          transform: scale(1);
                               }
                             50% {
          transform: scale(1.08);
          }
          }  


          /*******************
          ******footer********
          *******************/

          footer {
            background-color: #222;
            text-align: center;
            justify-content: center;
            padding: 0 20px;
            font-size: 1rem;
            width: 80%;
            margin-top: auto;
            margin: 0 auto;
            height: 80px;
            color: #fff;
              border-radius: 20px;
          }
          .email {
            text-decoration: none;
            color: #00bcd4;
          }
        /*****************
        **navigation bar**
        *****************/
        .navbar {
          display: flex;
          justify-content: center;
          align-items: center;
          position: fixed;
          width: 90%;
          height: 80px;
          top: 10px;
          background: #1b7b71;
          border-radius: 45px;
          box-shadow: 0 10px 20px rgba(0 , 0 , 0 , 0.5);
          backdrop-filter: blur(10px);
          z-index: 999;
        }

        .nav-container {
          display: flex;
          width: 100%;
          align-items: center;
          justify-content: space-between;
          padding: 0 2rem;
          max-width: 1300px;
        }

        .nav-container .menu-container {
          display: flex;
          align-items: center;
          gap: 5rem;
          list-style: none;
        }

        .nav-container .menu-container li a {
          text-decoration: none;
          color: #ffffff;
          font-size: 20px;
          font-weight: 600;
          padding: 3px 20px;
          border: 2px solid transparent;
          border-radius: 20px;
          transition: all 0.4s;
          white-space: nowrap;
        }

        .nav-container .menu-container li a:hover {
           color: #162530;
           background: rgba(188, 212, 229, 0.8);
           border: 4px solid #fff;
        }

        /*******span & logo sittings*******/
         .logo {
          text-decoration: none;
          font-weight: 700;
          font-size: 2rem;
          color: black;
          cursor: pointer;
          display: inline-block;
          margin-left: 30px;
         }

         .logo span {
          color: white;
         }

         /******theme button*******/

         #theme-button {
          background: transparent;
          border: transparent;
          font-size: 2rem;
          font-weight: 500;
          cursor: pointer
         }

         #theme-button:hover {
          background-color: red;
          border: 2px solid ;
          border-radius: 15px;
          transition: 0.6s ease;
         }

         /********Burger Menu********/
         .navbar-toggle {
          display: none;
          background: transparent;
          border: none;
          padding: 10px;
          cursor: pointer;
         }

         .bar {
          display: block;
          width: 25px;
          height: 3px;
          transition: all 0.3s ease;
          background: white;
          margin: 5px auto;
         }

         /**************
         *Media Quiries*
         **************/

    @media (max-width: 1024px) {
        
      .navbar {
        backdrop-filter: none;
      }
      
      .nav-container .menu-container {
        display: none;
        flex-direction: column;
        align-items: flex-start;
        gap: 2rem !important;
        position: absolute;
        height: 100vh;
        width: 250px;
        top: 0;
        right: 0;
        padding: 5rem 1.7rem;
        box-shadow: 0 10px rgba(0 , 0 , 0 ,0.5);
        backdrop-filter:blur(10px);
      }

         .nav-container .menu-container.active {
           display: flex;
         }
     .navbar-toggle {
      display: block;
      z-index: 999;
     }

     .navbar-toggle.active .bar:nth-child(2) {
      opacity: 0;
     }

     .navbar-toggle.active .bar:nth-child(1) {
       transform: translateY(8px) rotate(45deg);
         }

      .navbar-toggle.active .bar:nth-child(3) {
        transform: translateY(-8px) rotate(-45deg)
         }
        

        .img-container img {
          display: none;
        }

        .text-container {
          font-size: 20px;
          display: flex;
          justify-content: center;
        }

        p {
          display: flex;
          align-items: center;
        }
      }

        @media (max-width: 480px) {
          .navbar-container {
              padding: 0 1rem;
          }

          .logo {
              font-size: 1.7rem;
          }

          .navbar-container .navbar-menu li a {
              font-size: 1.2rem;
              padding: 3px 15px;
              }


}
    </style>
</head>
<body>
  <nav class="navbar">

  <div class="nav-container">
    <a href="#" class="logo">s<span>s</span></a>
    
    <button id="theme-button">🌞</button>
    
    <button class="navbar-toggle">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>


    <ul class="menu-container">
       <li><a href="#home">Home</a></li>
       <li><a href="eposides.html">Eposides</a></li>
       <li><a href="#">About</a></li>
       <li><a href="#">Contact</a></li>
    </ul>
  </div>  
  
</nav>

<div class="hero-section">
    <div class="text-container">
      <p>Welcome to </p>
      <h1> Otaku <span>Zone</span></h1>
   <div class="img-container">
    <img src="https://i.ibb.co/hxWQtD9B/naruto-uzumaki-narutomaki-boruto-uzumaki-shikamaru-nara-naruto-dc848c8e3bad243c2530578db5b43af3.png" alt="the main pic">
   </div>
</div>

  <footer>
    <div class="footer-container">
      <p>all rights reserved for Snail Studio</p>
      <a href="mailto:ahmedtopone111@gmail.com" class="email">ahmedtopone111@gmail.com</a>
    </div>
  </footer>

<script>

  const ThemeButton = document.querySelector('#theme-button')
  const NavbarToggle = document.querySelector('.navbar-toggle')
  const NavbarMenu = document.querySelector('.menu-container')

  NavbarToggle.addEventListener('click' , function() {
    NavbarToggle.classList.toggle('active');
    NavbarMenu.classList.toggle('active');

    ThemeButton.addEventListener("click", () => {
      document.body.classList.toggle("light");
    })
  })

</script>
</body>
</html>
