<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Otaku Zone</title>
    <style>
      /*************************
        *********basices**********
        **************************/
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(to right, #0d736c, #1fff, #0d736c);
        display: flex;
        flex-direction: column;
      }

      body.light {
        min-height: 100vh;
        background: orange !important;
      }

      section {
        width: 100%;
        box-sizing: border-box;
        display: flex;
        scroll-behavior: smooth;
      }

      /*****************
      **navigation bar**
      *****************/
      .navbar {
        display: flex;
        justify-content: center;
        align-items: center;
        position: fixed;
        width: 100%;
        height: 80px;
        top: 10px;
        background: #0d736c;
        border-radius: 45px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
        z-index: 999;
      }
      .navbar.light {
        background: #945410;
      }

      .nav-container {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        padding: 0 2rem;
        max-width: 1300px;
      }

      .nav-container .menu-container {
        display: flex;
        align-items: center;
        gap: 5rem;
        list-style: none;
      }

      .nav-container .menu-container li a {
        text-decoration: none;
        color: #ffffff;
        font-size: 20px;
        font-weight: 600;
        padding: 3px 20px;
        border: 2px solid transparent;
        border-radius: 20px;
        transition: all 0.4s;
        white-space: nowrap;
      }

      .nav-container .menu-container li a:hover {
        color: #162530;
        background: rgba(188, 212, 229, 0.8);
        border: 2px solid #fff;
      }

      /*******span & logo sittings*******/
      .logo {
        text-decoration: none;
        font-weight: 700;
        font-size: 2rem;
        color: black;
        cursor: pointer;
        display: inline-block;
        margin-left: 30px;
      }

      .logo span {
        color: white;
      }

      /******theme button*******/

      #theme-button {
        background: transparent;
        border: transparent;
        font-size: 2rem;
        font-weight: 500;
        cursor: pointer;
      }

      #theme-button:hover {
        background-color: red;
        border: 2px solid;
        border-radius: 15px;
        transition: 0.6s ease;
      }

      /********Burger Menu********/
      .navbar-toggle {
        display: none;
        background: transparent;
        border: none;
        padding: 10px;
        cursor: pointer;
      }

      .bar {
        display: block;
        width: 25px;
        height: 3px;
        transition: all 0.3s ease;
        background: white;
        margin: 5px auto;
      }
/********************************************
             Episodes container start
*********************************************/
      .episodes-container {
        display: grid;
        background-color: #162530;
        justify-content: center;
        width: 100%;
        height: auto;
        min-height: 100vh;
        margin-top: 90px;
        margin-left: 0;
        margin-right: 0;
        border-radius: 20px;
      }

      .episode {
        background-color: #945410;
        width: 100%;
        height: 230px;
        margin: 70px 30px;
        border-radius: 10px;
        overflow: hidden;
        border: 2px solid green;
      }

      .episode img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        display: block;
      }

      .btn {
        background-color: aqua;
        border-radius: 5px;
        font-weight: 500;
        color: black;
        display: inline-block;
        cursor: pointer;
        transition: 0.5s;
        border: 2px solid transparent;
        margin-bottom: 2px;
      }

      .btn:hover {
        background-color: #fff;
        border: 2px solid red;
      }

      h3 {
        margin-bottom: 2px;
        color: #000;
        font-weight: 600;
        font-size: 1.3rem;
      }

      .episode span {
        color: #0d736c;
      }
      /************************************************
      ************episodes-container end
      *************************************************/

      @media (max-width: 768px) {
        .navbar {
          backdrop-filter: none;
        }

        .nav-container .menu-container {
          display: none;
          flex-direction: column;
          align-items: flex-start;
          gap: 2rem !important;
          position: absolute;
          height: 100vh;
          width: 250px;
          top: 0;
          right: 0;
          padding: 5rem 1.7rem;
          box-shadow: 0 10px rgba(0, 0, 0, 0.5);
          backdrop-filter: blur(10px);
        }

        .nav-container .menu-container.active {
          display: flex;
        }
        .navbar-toggle {
          display: block;
          z-index: 999;
        }

        .navbar-toggle.active .bar:nth-child(2) {
          opacity: 0;
        }

        .navbar-toggle.active .bar:nth-child(1) {
          transform: translateY(8px) rotate(45deg);
        }

        .navbar-toggle.active .bar:nth-child(3) {
          transform: translateY(-8px) rotate(-45deg);
        }
      }

      @media (max-width: 480px) {
        .navbar-container {
          padding: 0 1rem;
        }

        .logo {
          font-size: 1.7rem;
        }

        .navbar-container .navbar-menu li a {
          font-size: 1.2rem;
          padding: 3px 15px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <a href="#" class="logo">s<span>s</span></a>

        <button id="theme-button">🌞</button>

        <button class="navbar-toggle">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>

        <ul class="menu-container">
          <li><a href="index.html">Home</a></li>
          <li><a href="episodes.html">Episodes</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </div>
    </nav>

    <div class="episodes-container">
      <div class ="episode">
          <img src="Attack-on-Titan-Complete-Season-One-Blu-ray-CrunchyRoll_bae1088f-782c-426f-b702-14a1ddb34913.70787b22d18ee4871d4a071f90b61926.jpeg" alt="A">
          <h3>attack on titan</h3>
          <button onclick="location.href='watch1.html'" class="btn">watch</button>
      </div>
    <div class="episode">
        <img src="" alt="B">
        <h3>Naruto shippuden</h3>
        <button onclick="location.href='watch2.html'" class="btn">watch</button>
    </div>
    </div>
    <script>
      const ThemeButton = document.querySelector("#theme-button");
      const NavbarToggle = document.querySelector(".navbar-toggle");
      const NavbarMenu = document.querySelector(".menu-container");

      NavbarToggle.addEventListener("click", function () {
        NavbarToggle.classList.toggle("active");
        NavbarMenu.classList.toggle("active");
      });
      ThemeButton.addEventListener("click", () => {
        document.body.classList.toggle("light");
        document.querySelector(".navbar").classList.toggle("light");
      });
    </script>
  </body>
</html>
